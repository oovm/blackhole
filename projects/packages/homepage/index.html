<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TON 618 · 黑洞可视化</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <main class="layout">
            <header>
                <h1>TON 黑洞模拟</h1>
                <p class="subtitle">史瓦西度规 · CPU 测地线（赤道薄盘） · UCF 运行时 · L0 呈现</p>
            </header>
            <section class="stage">
                <canvas id="view" width="640" height="360"></canvas>
            </section>
            <section class="controls">
                <label>
                    质量 M
                    <input id="mass" type="range" min="0.5" max="3" step="0.1" value="1" />
                    <span id="massVal">1.0</span>
                </label>
                <label>
                    宽度
                    <input id="width" type="number" min="320" max="960" step="80" value="640" />
                </label>
                <label>
                    高度
                    <input id="height" type="number" min="180" max="540" step="45" value="360" />
                </label>
                <button id="render" type="button">渲染一帧</button>
            </section>
            <footer id="status">就绪</footer>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
